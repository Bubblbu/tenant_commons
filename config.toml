# config.toml
[paths]
buildings = "data/derived/buildings.csv"
addresses = "data/raw/cov_open_data/property-addresses.csv"
blocks = "data/raw/cov_open_data/block-outlines.csv"
block_numbers = "data/raw/cov_open_data/block-numbers.csv"
local_area_boundary = "data/raw/cov_open_data/local-area-boundary.csv"
local_area_boundary_geojson = "data/raw/cov_open_data/local-area-boundary.geojson"
artifacts = "data/derived/artifacts"
# Raw NationBuilder export, gitignored (see data/raw/nationbuilder/).
vtu_raw = "data/raw/nationbuilder/membership_full.csv"
tc_core_db = "data/derived/tc_core.db"
pid_address_map = "data/derived/pid_address_map.csv"
sro_housing = "data/raw/cov_foi/sra_housing_combined.csv"
rezoning_applications = "data/raw/cov_foi/rezoning_applications.csv"
city_owned_properties = "data/raw/cov_open_data/city-owned-properties.csv"
coops = "data/raw/chf_bc/coops_vancouver.csv"
ownership_claims = "data/curated/ownership_claims.csv"
lotr_ownership = "data/raw/samwise/samwise-export.csv"
lotr_searches = "data/raw/samwise/searches"
property_managers = "data/curated/property_managers.toml"
manager_listings = "data/raw/property_managers"
strata_lot_pids = "data/curated/strata_lot_pids.csv"

# Boundary overlays a building can belong to alongside its neighbourhood:
# each is a Filters > Neighbourhoods entry (after the separator) and a
# Show on map toggle. `feature` picks one polygon by its `name`; without it
# every feature in `source` belongs to the area. `key` is in shared links,
# so keep it stable.
[[overlay_areas]]
key = "chinatown"
name = "Chinatown"
source = "data/raw/boundaries/DTES_sub_zoning/DTES_sub_zoning.shp"
feature = "Chinatown"

[[overlay_areas]]
key = "deod"
name = "DEOD"
source = "data/raw/boundaries/DTES_sub_zoning/DTES_sub_zoning.shp"
feature = "DEOD"

[[overlay_areas]]
key = "village-plan"
name = "Villages Plan"
source = "data/curated/villages_plan_areas.geojson"
