# .github/workflows/ci.yml
# The gate on `main`: nothing merges without both jobs passing. `production`
# only ever receives a built frontend/dist/ snapshot pushed via `npm run
# deploy` (see frontend/README.md) — it never has commits or PRs of its own,
# so there's nothing for CI to gate there.
#
# backend  — sica_core: ruff (advisory until the existing findings are
#            cleaned up) and pytest.
# frontend — frontend/: type check, unit tests, and a production build
#            against frontend/fixtures/ (generated, invented data; CI cannot
#            run ingest because data/ is gitignored). It proves the build and
#            the artifact contract, not the data.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --group dev || uv sync

      - name: Ruff lint (advisory)
        continue-on-error: true
        run: uv run ruff check .

      - name: Ruff format check (advisory)
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build against the synthetic fixtures
        env:
          SICA_ARTIFACTS_DIR: fixtures
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/data/marker_metadata.json
